name: FTP Deploy

on:
  push:
    branches:
      - draft

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove git metadata
        run: rm -rf .git

      - name: Upload to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Remote directory on the FTP server (empty = root)
          server-dir: ./
          # Exact mirror: delete remote files/directories that no longer exist in the repo
          dangerous-clean-slate: true
          # Never uploaded: server-side scripts
          exclude: |
            **/scripts/**
